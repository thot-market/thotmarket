<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f3eb">
    <title>My data · thot market</title>
    <link rel="icon" href="/assets/thot-logo.png" type="image/png">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/staking.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body class="connected-app">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="workspace">
      <header class="topbar">
        <a class="brand" href="/" aria-label="thot market home"><img class="thot-app-logo" src="/assets/thot-logo.png" alt=""><span>thot market</span></a>
        <nav class="journey-nav" aria-label="Main navigation"><button class="nav-item active" data-view="vault">My data</button><button class="nav-item" data-view="market">Marketplace</button><button class="nav-item" data-view="earnings">Earnings</button><button class="nav-item" data-view="receipts">Purchases</button><button class="nav-item" data-view="operator" hidden>Treasury</button></nav>
        <div class="journey-account"><button id="wallet-summary" class="wallet-summary" data-action="journey-wallet" aria-label="Wallet balance and account" hidden></button><details class="journey-menu" hidden><summary aria-label="More workspace options">•••</summary><nav aria-label="Account and tools">
          <button class="nav-item" data-action="journey-connections">Connections</button>
          <button class="nav-item" data-view="thot">Manage THOT</button>
          <button class="nav-item" data-view="referrals" hidden>Referrals</button>
          <button class="nav-item" data-view="leaderboard" hidden>Market activity</button>
          <a class="nav-item" id="operations-console-link" href="/ops" hidden>Operations</a>
          <button class="nav-item" id="trace-explorer-nav" data-action="open-trace-explorer" hidden>Trace explorer</button>
          <div class="session-control"><label for="role">View as</label><select id="role"><option value="user">Contributor</option><option value="buyer_admin">Buyer</option><option value="operator_security">Operator</option></select><button class="icon-button" data-action="refresh" aria-label="Refresh current view">↻</button></div>
          <details class="local-tools"><summary>Developer tools</summary><button data-action="worker">Run pending jobs</button><button data-action="burn">Simulate burn completion</button><small>Simulated funding and chain execution. No real tokens or payments.</small></details>
        </nav></details></div>
      </header>
      <div class="environment"><span class="status-dot"></span>Opening workspace</div>
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <main id="main" tabindex="-1"><div class="loading"><span class="spinner"></span><p>Opening your workspace…</p></div></main>
      <footer class="page-footer"><span>Your work. Your terms.</span><span><a href="/">Home</a> <a href="/read">Read</a> <a href="/mechanism">Mechanism</a></span></footer>
    </div>
    <dialog id="detail-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript><p class="notice">Enable JavaScript to open your thot market workspace.</p></noscript>
  </body>
</html>
